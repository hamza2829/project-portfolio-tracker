[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-portfolio-tracker"
version = "0.1.0"
description = "Synthetic department portfolio consolidation and quarterly reviews"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<3", "openpyxl>=3.1,<4", "reportlab>=4,<5"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-cov>=6,<8", "ruff>=0.14,<1", "pypdf>=6,<7"]
ci = ["playwright==1.56.0", "pymupdf>=1.26,<2"]

[project.scripts]
portfolio = "portfolio_tracker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["portfolio_tracker"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
