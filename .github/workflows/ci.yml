name: Portfolio CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  portfolio:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tools only on the runner
        run: |
          mkdir -p artifacts/reports artifacts/previews
          python -m pip install -e '.[test,ci]'
          python -m pip freeze > artifacts/dependencies.txt
      - name: Ruff
        run: ruff check src tests ci 2>&1 | tee artifacts/ruff.log
      - name: Tests and minimum 85 percent line coverage
        run: |
          pytest --cov=portfolio_tracker --cov-fail-under=85 --cov-report=term-missing --cov-report=xml:artifacts/coverage.xml --cov-report=json:artifacts/coverage.json --cov-report=html:artifacts/coverage-html --junitxml=artifacts/tests.xml 2>&1 | tee artifacts/pytest.log
      - name: Full synthetic CSV and JSON CLI pipeline
        run: python ci/pipeline.py 2>&1 | tee artifacts/pipeline.log
      - name: Prepare native workbook rendering
        timeout-minutes: 10
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-calc > artifacts/libreoffice-install.log 2>&1
          libreoffice -env:UserInstallation=file:///tmp/portfolio-render --headless --convert-to pdf --outdir artifacts/previews artifacts/reports/portfolio.xlsx 2>&1 | tee artifacts/workbook-render.log
      - name: Browser screenshots and PDF visual checks
        run: |
          python -m playwright install --only-shell chromium
          python ci/visual_check.py 2>&1 | tee artifacts/visual-check.log
      - name: Measure real reports
        run: python ci/measure.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-results
          path: artifacts/
          retention-days: 14
